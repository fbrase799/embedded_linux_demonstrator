require conf/distro/poky.conf

DISTRO = "eld"
DISTRO_NAME = "Embedded Linux Demonstrator"
DISTRO_VERSION = "1.0.0"
DISTRO_CODENAME = "demo"
SDK_VENDOR = "-eldsdk"
SDK_VERSION = "${DISTRO_VERSION}"
MAINTAINER = "Embedded Linux Demonstrator <dev@localhost>"

# Product hostname shown in the Qt UI and on the network.
hostname = "raspi-demo"

INIT_MANAGER = "systemd"

DISTRO_FEATURES:append = " opengl pam"

# Development image: empty root password and SSH. Remove for production.
EXTRA_IMAGE_FEATURES ?= "debug-tweaks"

# SDK used for application development (cross compiler, sysroot, Qt, CMake).
SDKIMAGE_FEATURES:append = " dev-pkgs dbg-pkgs"
TOOLCHAIN_HOST_TASK:append = " nativesdk-packagegroup-qt6-toolchain-host nativesdk-cmake"
TOOLCHAIN_TARGET_TASK:append = " qtbase-dev qtdeclarative-dev"
