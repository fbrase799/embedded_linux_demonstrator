header:
  version: 14

machine: raspberrypi4-64
distro: eld
target:
  - embedded-linux-demo-image

repos:
  poky:
    url: https://git.yoctoproject.org/git/poky
    branch: scarthgap
    path: layers/poky
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: scarthgap
    path: layers/meta-openembedded
    layers:
      meta-oe:
      meta-python:
      meta-multimedia:
      meta-networking:

  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi.git
    branch: scarthgap
    path: layers/meta-raspberrypi

  meta-qt6:
    url: https://code.qt.io/yocto/meta-qt6.git
    branch: "6.8"
    path: layers/meta-qt6

  meta-embedded-linux-demonstrator:
    path: meta-embedded-linux-demonstrator

bblayers_conf_header:
  standard: |
    POKY_BBLAYERS_CONF_VERSION = "2"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""

local_conf_header:
  standard: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_rpm"
    SDKMACHINE = "x86_64"
    USER_CLASSES = "buildstats"
    PATCHRESOLVE = "noop"
    BB_DISKMON_DIRS ??= "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
    DL_DIR ?= "${TOPDIR}/downloads"
    SSTATE_DIR ?= "${TOPDIR}/sstate-cache"
    # Keep parallelism modest so gcc-cross does not OOM on smaller WSL hosts.
    # Override with: BB_NUMBER_THREADS=4 PARALLEL_MAKE="-j 4" if you have ≥16 GB RAM.
    BB_NUMBER_THREADS ?= "2"
    PARALLEL_MAKE ?= "-j 2"
    # Poky's default OEEquivHash starts hashserv on a Unix socket in TOPDIR.
    # Docker Desktop bind-mounts do not support AF_UNIX (ENOTSUP).
    BB_SIGNATURE_HANDLER = "OEBasicHash"
    BB_HASHSERVE = ""

  licenses: |
    LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"

  raspberrypi: |
    RPI_USE_U_BOOT = "1"
    ENABLE_UART = "1"
    ENABLE_I2C = "1"
    BOOT_DELAY = "0"
    DISABLE_OVERSCAN = "1"
    # Match Raspberry Pi OS (2026-04-21) config.txt for the official 7".
    # Do not set hdmi_force_hotplug or dtoverlay=vc4-kms-dsi-7inch.
    RPI_EXTRA_CONFIG = "display_auto_detect=1\\nmax_framebuffers=2\\ndisable_fw_kms_setup=1\\narm_64bit=1\\ndtoverlay=eld-dsi-panel\\n"
    IMAGE_BOOT_FILES:append = " eld-dsi-panel.dtbo;overlays/eld-dsi-panel.dtbo"

  qt: |
    # Qt 6.8 treats desktop OpenGL and GLES2 as mutually exclusive.
    # Poky+x11 enables PACKAGECONFIG "gl"; the kiosk UI needs eglfs/GLES2.
    # libinput/evdev: official 7" FT5406 touch.
    PACKAGECONFIG:remove:pn-qtbase = "gl"
    PACKAGECONFIG:append:pn-qtbase = " eglfs gbm kms gles2 fontconfig libinput"

  application-src: |
    EXTERNALSRC:pn-embedded-linux-ui = "${TOPDIR}/../application/embedded-linux-ui"

  development: |
    EXTRA_IMAGE_FEATURES += "debug-tweaks ssh-server-openssh"
    IMAGE_BOOT_FILES:append = " uboot.env"
    WKS_FILE = "embedded-linux-demo.wks"
